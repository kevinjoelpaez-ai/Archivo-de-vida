<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Visor para investigación artística</title>


<!-- =========================================
     INTERNET ARCHIVE BOOKREADER
========================================= -->

<script src="https://unpkg.com/@internetarchive/bookreader@5.0.0-94/BookReader/webcomponents-bundle.js"></script>

<script src="https://unpkg.com/@internetarchive/bookreader@5.0.0-94/BookReader/jquery-3.js"></script>

<link
  rel="stylesheet"
  href="https://unpkg.com/@internetarchive/bookreader@5.0.0-94/BookReader/BookReader.css"
>

<script src="https://unpkg.com/@internetarchive/bookreader@5.0.0-94/BookReader/BookReader.js"></script>


<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;

  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

body {
  background: #eeeeee;
  color: #222;
}


/* =========================================
   APP
========================================= */

.app {
  width: min(1100px, calc(100% - 32px));

  margin: 0 auto;

  padding: 40px 0;
}


h1 {
  margin: 0 0 8px;

  font-size: 26px;
}


.intro {
  margin: 0 0 28px;

  color: #666;
}


/* =========================================
   CARGA
========================================= */

.carga {
  display: block;

  width: 100%;
  min-height: 220px;

  padding: 35px;

  border: 2px dashed #999;
  border-radius: 12px;

  background: white;

  text-align: center;

  cursor: pointer;
}


.carga.arrastrando {
  border-color: #222;

  background: #f5f5f5;
}


.carga-titulo {
  display: block;

  margin-bottom: 10px;

  font-size: 18px;
  font-weight: bold;
}


.carga-ayuda {
  display: block;

  margin-bottom: 20px;

  color: #666;

  font-size: 14px;
}


.boton-carga {
  display: inline-block;

  padding: 10px 18px;

  border: 1px solid #222;
  border-radius: 5px;

  background: #222;
  color: white;

  font-size: 14px;
}


#archivo {
  display: none;
}


/* =========================================
   ESTADO
========================================= */

.estado {
  min-height: 20px;

  margin-top: 15px;

  color: #666;

  font-size: 13px;
}


/* =========================================
   PROGRESO
========================================= */

.progreso {
  display: none;

  width: 100%;
  height: 8px;

  margin-top: 10px;

  overflow: hidden;

  border-radius: 999px;

  background: #ddd;
}


.progreso.visible {
  display: block;
}


.progreso-barra {
  width: 0%;
  height: 100%;

  background: #222;

  transition: width .1s linear;
}


/* =========================================
   DOCUMENTO
========================================= */

.documento {
  display: none;

  margin-top: 25px;
}


.documento.visible {
  display: block;
}


.info {
  padding: 18px 20px;

  border: 1px solid #ccc;
  border-radius: 9px;

  background: white;
}


.info h2 {
  margin: 0 0 14px;

  font-size: 18px;
}


.dato {
  display: flex;

  justify-content: space-between;

  gap: 20px;

  padding: 8px 0;

  border-bottom: 1px solid #eee;
}


.dato:last-child {
  border-bottom: 0;
}


.etiqueta {
  font-weight: bold;
}


.valor {
  color: #555;

  text-align: right;
}


/* =========================================
   MODOS PRINCIPALES
========================================= */

.modos-principales {
  display: flex;

  gap: 8px;

  margin-top: 20px;
}


.boton-modo {
  flex: 1;

  padding: 11px 16px;

  border: 1px solid #999;
  border-radius: 5px;

  background: white;
  color: #222;

  font-size: 14px;

  cursor: pointer;
}


.boton-modo.activo {
  border-color: #222;

  background: #222;
  color: white;
}


/* =========================================
   VISOR BOOKREADER
========================================= */

.visor-libro {
  display: none;

  margin-top: 22px;

  overflow: hidden;

  border: 1px solid #bbb;
  border-radius: 8px;

  background: #939598;
}


.visor-libro.visible {
  display: block;
}


#BookReader,
.BookReader {
  width: 100%;
  height: 820px;

  margin: 0 auto;

  overflow: hidden;
}


/* =========================================
   VISOR DE CAPAS
========================================= */

.visor-capas {
  display: none;

  margin-top: 24px;
}


.visor-capas.visible {
  display: block;
}


.controles-capas {
  width: min(100%, 720px);

  margin: 0 auto 20px;

  padding: 18px 20px;

  border: 1px solid #ccc;
  border-radius: 9px;

  background: white;
}


.control {
  margin-bottom: 15px;
}


.control:last-child {
  margin-bottom: 0;
}


.fila {
  display: flex;

  justify-content: space-between;

  gap: 15px;

  margin-bottom: 6px;
}


.fila label {
  font-size: 13px;
  font-weight: bold;
}


.valor-control {
  color: #555;

  font-size: 13px;
}


input[type="range"] {
  width: 100%;
}


/* =========================================
   MODOS INTERNOS DE CAPAS
========================================= */

.modos-capas {
  display: flex;

  gap: 8px;
}


.modo-capas {
  flex: 1;

  padding: 8px 12px;

  border: 1px solid #999;
  border-radius: 4px;

  background: white;

  cursor: pointer;
}


.modo-capas.activo {
  border-color: #222;

  background: #222;
  color: white;
}


#restablecer {
  width: 100%;

  padding: 9px;

  border: 1px solid #999;
  border-radius: 4px;

  background: white;

  cursor: pointer;
}


/* =========================================
   MESA DE CAPAS
========================================= */

.zona-scroll {
  width: 100%;

  overflow-x: auto;
  overflow-y: visible;

  padding-bottom: 15px;
}


.zona-mesa {
  position: relative;

  width: 1500px;
  height: 1150px;

  margin: 0 auto;

  background:
    radial-gradient(
      circle at center,
      rgba(255,255,255,.55),
      rgba(255,255,255,0) 62%
    );
}


.mesa {
  position: absolute;

  top: 40px;
  left: 50%;

  width: 420px;

  transform: translateX(-50%);

  overflow: visible;

  isolation: isolate;
}


/* =========================================
   LÁMINAS
========================================= */

.lamina {
  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 100%;

  object-fit: contain;

  mix-blend-mode: multiply;

  transform-origin: center;

  cursor: grab;

  user-select: none;
  -webkit-user-select: none;

  touch-action: none;
}


.lamina.arrastrando {
  cursor: grabbing;
}


.estado-capas {
  margin-top: 12px;

  color: #666;

  font-size: 12px;

  text-align: center;
}


/* =========================================
   MÓVIL
========================================= */

@media (max-width:600px) {

  .app {
    width: calc(100% - 20px);

    padding-top: 20px;
  }


  .carga {
    min-height: 180px;

    padding: 25px 15px;
  }


  .dato {
    flex-direction: column;

    gap: 3px;
  }


  .valor {
    text-align: left;
  }


  .modos-principales {
    flex-direction: column;
  }


  #BookReader,
  .BookReader {
    height: 700px;
  }


  .zona-mesa {
    width: 1100px;
  }

}

</style>

</head>


<body>

<main class="app">


  <h1>
    Visor para investigación artística
  </h1>


  <p class="intro">
    Cargá un PDF o una serie de imágenes.
    Todo se procesa localmente en tu navegador.
  </p>


  <!-- =====================================
       CARGA
  ====================================== -->

  <label
    id="zonaCarga"
    class="carga"
    for="archivo"
  >

    <span class="carga-titulo">
      Arrastrá tu documento acá

    <span class="boton-carga">

  >


  <div

  <section

          id="cantidadPaginas"

        ></span>

      </div>


      <div class="dato">

        <span class="etiqueta">
          Primera página
        </span>

        <span

        ></span>

      </div>

    </div>


    <!-- =================================
         MODOS PRINCIPALES
    ================================== -->

    <div class="modos-principales">


      <button
        id="botonLibro"
        class="boton-modo activo"
      >
        Hojear
      </button>


      <button
        id="botonCapas"
        class="boton-modo"
      >
        Superponer capas
      </button>


    </div>


    <!-- =================================
         BOOKREADER
    ================================== -->

    <section

    <!-- =================================
         CAPAS
    ================================== -->

    >

        <!-- MODO -->

  </section>


</main>



<!-- =========================================
     APLICACIÓN
========================================= -->

<script type="module">


/* =========================================
   PDF.JS
========================================= */

import * as pdfjsLib from
  "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/build/pdf.mjs";


pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/build/pdf.worker.mjs";


/* =========================================
   ELEMENTOS
========================================= */

const input =
  document.getElementById(
    "archivo"
  );


const zonaCarga =
  document.getElementById(
    "zonaCarga"
  );


const estado =
  document.getElementById(
    "estado"
  );


const progreso =
  document.getElementById(
    "progreso"
  );


const progresoBarra =
  document.getElementById(
    "progresoBarra"
  );


const documento =
  document.getElementById(
    "documento"
  );


const tipo =
  document.getElementById(
    "tipo"
  );


const nombre =
  document.getElementById(
    "nombre"
  );


const cantidadPaginas =
  document.getElementById(
    "cantidadPaginas"
  );


const dimensiones =
  document.getElementById(
    "dimensiones"
  );


/* BOOKREADER */


const botonLibro =
  document.getElementById(
    "botonLibro"
  );


const visorLibro =
  document.getElementById(
    "visorLibro"
  );


const contenedorBookReader =
  document.getElementById(
    "BookReader"
  );


/* CAPAS */


const botonCapas =
  document.getElementById(
    "botonCapas"
  );


const visorCapas =
  document.getElementById(
    "visorCapas"
  );


const mesa =
  document.getElementById(
    "mesa"
  );


const zonaScroll =
  document.getElementById(
    "zonaScroll"
  );


const controlPaginas =
  document.getElementById(
    "controlPaginas"
  );


const controlOpacidad =
  document.getElementById(
    "controlOpacidad"
  );


const controlTamano =
  document.getElementById(
    "controlTamano"
  );


const valorPaginas =
  document.getElementById(
    "valorPaginas"
  );


const valorOpacidad =
  document.getElementById(
    "valorOpacidad"
  );


const valorTamano =
  document.getElementById(
    "valorTamano"
  );


const etiquetaPaginas =
  document.getElementById(
    "etiquetaPaginas"
  );


const modoAcumulacion =
  document.getElementById(
    "modoAcumulacion"
  );


const modoIndividual =
  document.getElementById(
    "modoIndividual"
  );


const restablecer =
  document.getElementById(
    "restablecer"
  );


const estadoCapas =
  document.getElementById(
    "estadoCapas"
  );


/* =========================================
   ESTADO GENERAL
========================================= */

let documentoActual = {

  tipo: null,

  nombre: null,

  paginas: []

};


let modoCapas =
  "acumulacion";


let posiciones =
  [];


let offsets =
  [];


let zSuperior =
  100;


/* BOOKREADER */


let bookReaderActual =
  null;


let bookReaderPreparado =
  false;


/* =========================================
   CARGA
========================================= */

input.addEventListener(

  "change",

  () => {


    if (
      input.files.length > 0
    ) {


      procesarArchivos(
        [...input.files]
      );


    }


  }

);



zonaCarga.addEventListener(

  "dragover",

  evento => {


    evento.preventDefault();


    zonaCarga.classList.add(
      "arrastrando"
    );


  }

);



zonaCarga.addEventListener(

  "dragleave",

  () => {


    zonaCarga.classList.remove(
      "arrastrando"
    );


  }

);



zonaCarga.addEventListener(

  "drop",

  evento => {


    evento.preventDefault();


    zonaCarga.classList.remove(
      "arrastrando"
    );


    const archivos =
      [
        ...evento.dataTransfer.files
      ];


    if (
      archivos.length > 0
    ) {


      procesarArchivos(
        archivos
      );


    }


  }

);


/* =========================================
   DESTRUIR BOOKREADER ANTERIOR
========================================= */

function limpiarBookReader() {


  if (
    bookReaderActual
  ) {


    try {


      if (
        typeof bookReaderActual.destroy ===
        "function"
      ) {


        bookReaderActual.destroy();


      }


    }

    catch (
      error
    ) {


      console.warn(
        "No fue necesario destruir BookReader.",
        error
      );


    }


  }


  bookReaderActual =
    null;


  bookReaderPreparado =
    false;


  contenedorBookReader.innerHTML =
    "Preparando libro...";


}


/* =========================================
   LIMPIAR DOCUMENTO ANTERIOR
========================================= */

function limpiarAnterior() {


  limpiarBookReader();


  if (
    documentoActual.paginas
  ) {


    documentoActual.paginas.forEach(

      pagina => {


        if (
          pagina.src &&
          pagina.src.startsWith(
            "blob:"
          )
        ) {


          URL.revokeObjectURL(
            pagina.src
          );


        }


      }

    );


  }


  documentoActual = {

    tipo: null,

    nombre: null,

    paginas: []

  };


  mesa.innerHTML =
    "";


  documento.classList.remove(
    "visible"
  );


  visorLibro.classList.remove(
    "visible"
  );


  visorCapas.classList.remove(
    "visible"
  );


  progreso.classList.remove(
    "visible"
  );


  progresoBarra.style.width =
    "0%";


}


/* =========================================
   PROCESAR ARCHIVOS
========================================= */

async function procesarArchivos(
  archivos
) {


  limpiarAnterior();


  const pdfs =
    archivos.filter(

      archivo =>

        archivo.type ===
        "application/pdf"

    );


  const imagenes =
    archivos.filter(

      archivo =>

        archivo.type.startsWith(
          "image/"
        )

    );


  /* UN PDF */


  if (
    pdfs.length === 1 &&
    archivos.length === 1
  ) {


    await procesarPDF(
      pdfs[0]
    );


    return;


  }


  /* VARIAS IMÁGENES */


  if (
    imagenes.length ===
    archivos.length
  ) {


    await procesarImagenes(
      imagenes
    );


    return;


  }


  estado.textContent =
    "Elegí un único PDF o un conjunto de imágenes.";


}


/* =========================================
   PDF
========================================= */

async function procesarPDF(
  archivo
) {


  try {


    estado.textContent =
      "Leyendo PDF...";


    progreso.classList.add(
      "visible"
    );


    const buffer =
      await archivo.arrayBuffer();


    const tarea =
      pdfjsLib.getDocument({

        data:
          new Uint8Array(
            buffer
          )

      });


    const pdf =
      await tarea.promise;


    documentoActual = {

      tipo:
        "PDF",

      nombre:
        archivo.name,

      paginas:
        []

    };


    /*
      Escala 2:
      calidad suficiente para
      lectura, dibujo y ampliación.
    */


    const ESCALA_PDF =
      2;


    for (

      let numero = 1;

      numero <= pdf.numPages;

      numero++

    ) {


      estado.textContent =
        `Preparando página ${numero} de ${pdf.numPages}...`;


      const paginaPDF =
        await pdf.getPage(
          numero
        );


      const viewport =
        paginaPDF.getViewport({

          scale:
            ESCALA_PDF

        });


      const canvas =
        document.createElement(
          "canvas"
        );


      const contexto =
        canvas.getContext(
          "2d"
        );


      canvas.width =
        Math.round(
          viewport.width
        );


      canvas.height =
        Math.round(
          viewport.height
        );


      await paginaPDF.render({

        canvasContext:
          contexto,

        viewport:
          viewport

      }).promise;


      const blob =
        await canvasABlob(
          canvas
        );


      const url =
        URL.createObjectURL(
          blob
        );


      documentoActual.paginas.push({

        numero:
          numero,

        src:
          url,

        width:
          canvas.width,

        height:
          canvas.height

      });


      progresoBarra.style.width =
        `${
          (
            numero /
            pdf.numPages
          ) * 100
        }%`;


    }


    estado.textContent =
      "PDF preparado correctamente.";


    prepararAplicacion();


  }

  catch (
    error
  ) {


    console.error(
      error
    );


    estado.textContent =
      "No se pudo preparar el PDF.";


  }


}


/* =========================================
   CANVAS → BLOB
========================================= */

function canvasABlob(
  canvas
) {


  return new Promise(

    (
      resolve,
      reject
    ) => {


      canvas.toBlob(


        blob => {


          if (
            blob
          ) {


            resolve(
              blob
            );


          }


          else {


            reject(

              new Error(
                "No se pudo convertir una página."
              )

            );


          }


        },


        "image/png"


      );


    }

  );


}


/* =========================================
   IMÁGENES
========================================= */

async function procesarImagenes(
  archivos
) {


  estado.textContent =
    "Preparando imágenes...";


  progreso.classList.add(
    "visible"
  );


  /*
    Orden natural:
    page1, page2, page10
  */


  archivos.sort(

    (
      a,
      b
    ) =>

      a.name.localeCompare(

        b.name,

        undefined,

        {

          numeric:
            true,

          sensitivity:
            "base"

        }

      )

  );


  documentoActual = {


    tipo:
      "Serie de imágenes",


    nombre:

      archivos.length === 1

      ?

      archivos[0].name

      :

      `${archivos[0].name} … ${archivos[archivos.length - 1].name}`,


    paginas:
      []


  };


  for (

    let indice = 0;

    indice < archivos.length;

    indice++

  ) {


    const archivo =
      archivos[indice];


    estado.textContent =
      `Preparando imagen ${indice + 1} de ${archivos.length}...`;


    const url =
      URL.createObjectURL(
        archivo
      );


    const tamano =
      await obtenerDimensionesImagen(
        url
      );


    documentoActual.paginas.push({


      numero:
        indice + 1,


      src:
        url,


      width:
        tamano.width,


      height:
        tamano.height


    });


    progresoBarra.style.width =
      `${
        (
          (indice + 1) /
          archivos.length
        ) * 100
      }%`;


  }


  estado.textContent =
    "Imágenes preparadas correctamente.";


  prepararAplicacion();


}


/* =========================================
   DIMENSIONES DE IMAGEN
========================================= */

function obtenerDimensionesImagen(
  src
) {


  return new Promise(

    (
      resolve,
      reject
    ) => {


      const imagen =
        new Image();


      imagen.onload =
        () => {


          resolve({


            width:
              imagen.naturalWidth,


            height:
              imagen.naturalHeight


          });


        };


      imagen.onerror =
        reject;


      imagen.src =
        src;


    }

  );


}


/* =========================================
   DOCUMENTO LISTO
========================================= */

function prepararAplicacion() {


  const paginas =
    documentoActual.paginas;


  tipo.textContent =
    documentoActual.tipo;


  nombre.textContent =
    documentoActual.nombre;


  cantidadPaginas.textContent =
    paginas.length;


  dimensiones.textContent =

    paginas.length

    ?

    `${paginas[0].width} × ${paginas[0].height} px`

    :

    "—";


  documento.classList.add(
    "visible"
  );


  progreso.classList.remove(
    "visible"
  );


  prepararVisorCapas();


  /*
    El modo inicial será HOJEAR.
  */


  mostrarLibro();


}


/* =========================================
   CREAR DATOS PARA BOOKREADER
========================================= */

function crearDatosBookReader() {


  const paginas =
    documentoActual.paginas;


  const hojas =
    paginas.map(

      pagina => ({


        width:
          pagina.width,


        height:
          pagina.height,


        uri:
          pagina.src


      })

    );


  const data =
    [];


  if (
    hojas.length === 0
  ) {


    return data;


  }


  /*
    Portada sola.
  */


  data.push([
    hojas[0]
  ]);


  /*
    Después:
    2 + 3
    4 + 5
    6 + 7
    etc.
  */


  for (

    let indice = 1;

    indice < hojas.length;

    indice += 2

  ) {


    const pliego =
      [
        hojas[indice]
      ];


    if (
      hojas[indice + 1]
    ) {


      pliego.push(
        hojas[indice + 1]
      );


    }


    data.push(
      pliego
    );


  }


  return data;


}


/* =========================================
   INICIAR BOOKREADER
========================================= */

function inicializarBookReader() {


  if (
    bookReaderPreparado
  ) {


    return;


  }


  if (
    documentoActual.paginas.length === 0
  ) {


    return;


  }


  try {


    contenedorBookReader.innerHTML =
      "";


    const tituloLibro =
      documentoActual.nombre
        .replace(
          /\.[^/.]+$/,
          ""
        );


    const opciones = {


      data:
        crearDatosBookReader(),


      bookTitle:
        tituloLibro,


      thumbnail:
        documentoActual.paginas[0].src,


      metadata: [


        {

          label:
            "Título",

          value:
            tituloLibro

        },


        {

          label:
            "Páginas",

          value:
            String(
              documentoActual.paginas.length
            )

        }


      ],


      ui:
        "full",


      el:
        "#BookReader"


    };


    bookReaderActual =
      new window.BookReader(
        opciones
      );


    bookReaderActual.init();


    bookReaderPreparado =
      true;


  }

  catch (
    error
  ) {


    console.error(
      error
    );


    contenedorBookReader.innerHTML =
      `
        <div style="
          padding:30px;
          color:white;
          font-size:14px;
        ">
          No se pudo iniciar BookReader.
          Revisá la consola del navegador.
        </div>
      `;


  }


}


/* =========================================
   MOSTRAR LIBRO
========================================= */

function mostrarLibro() {


  visorCapas.classList.remove(
    "visible"
  );


  visorLibro.classList.add(
    "visible"
  );


  botonLibro.classList.add(
    "activo"
  );


  botonCapas.classList.remove(
    "activo"
  );


  /*
    Esperamos a que el contenedor
    sea visible antes de iniciar
    BookReader.
  */


  requestAnimationFrame(

    () => {


      inicializarBookReader();


      /*
        Si ya estaba iniciado y volvemos
        desde Capas, le permitimos
        recalcular el tamaño.
      */


      if (
        bookReaderActual &&
        typeof bookReaderActual.resize ===
        "function"
      ) {


        try {


          bookReaderActual.resize();


        }

        catch (
          error
        ) {


          console.warn(
            error
          );


        }


      }


    }

  );


}


/* =========================================
   MOSTRAR CAPAS
========================================= */

function mostrarCapas() {


  visorLibro.classList.remove(
    "visible"
  );


  visorCapas.classList.add(
    "visible"
  );


  botonCapas.classList.add(
    "activo"
  );


  botonLibro.classList.remove(
    "activo"
  );


  actualizarCapas();


  requestAnimationFrame(

    () => {


      zonaScroll.scrollLeft =
        (
          zonaScroll.scrollWidth -
          zonaScroll.clientWidth
        ) / 2;


    }

  );


}


/* =========================================
   BOTONES PRINCIPALES
========================================= */

botonLibro.addEventListener(

  "click",

  mostrarLibro

);


botonCapas.addEventListener(

  "click",

  mostrarCapas

);


/* =========================================
   OFFSETS DE CAPAS
========================================= */

function crearOffsets(
  cantidad
) {


  const patron = [


    {x:0, y:0},

    {x:2, y:0},

    {x:-1, y:1},

    {x:1, y:-1},

    {x:-2, y:1},

    {x:0, y:-2},

    {x:2, y:1},

    {x:-1, y:-2},

    {x:1, y:2},

    {x:-2, y:0},

    {x:2, y:-1},

    {x:0, y:2}


  ];


  const resultado =
    [];


  for (

    let indice = 0;

    indice < cantidad;

    indice++

  ) {


    const base =
      patron[
        indice %
        patron.length
      ];


    resultado.push({


      x:
        base.x,


      y:
        base.y


    });


  }


  return resultado;


}


/* =========================================
   PREPARAR VISOR DE CAPAS
========================================= */

function prepararVisorCapas() {


  mesa.innerHTML =
    "";


  const paginas =
    documentoActual.paginas;


  offsets =
    crearOffsets(
      paginas.length
    );


  posiciones =
    offsets.map(

      posicion => ({


        x:
          posicion.x,


        y:
          posicion.y


      })

    );


  controlPaginas.max =
    paginas.length;


  controlPaginas.value =
    paginas.length;


  valorPaginas.textContent =
    `${paginas.length} / ${paginas.length}`;


  /*
    Relación de aspecto tomada
    de la primera página.
  */


  if (
    paginas.length > 0
  ) {


    mesa.style.aspectRatio =
      `${paginas[0].width} / ${paginas[0].height}`;


  }


  paginas.forEach(

    (
      pagina,
      indice
    ) => {


      const imagen =
        document.createElement(
          "img"
        );


      imagen.className =
        "lamina";


      imagen.src =
        pagina.src;


      imagen.alt =
        `Página ${pagina.numero}`;


      imagen.dataset.indice =
        indice;


      imagen.draggable =
        false;


      imagen.style.zIndex =
        indice + 1;


      mesa.appendChild(
        imagen
      );


    }

  );


  zSuperior =
    paginas.length +
    100;


  configurarArrastre();


  actualizarCapas();


}


/* =========================================
   COLOCAR CAPA
========================================= */

function colocarPagina(
  pagina,
  indice
) {


  pagina.style.transform =
    `translate(
      ${posiciones[indice].x}px,
      ${posiciones[indice].y}px
    )`;


}


/* =========================================
   ACTUALIZAR CAPAS
========================================= */

function actualizarCapas() {


  const laminas =
    [
      ...mesa.querySelectorAll(
        ".lamina"
      )
    ];


  const seleccion =
    Number(
      controlPaginas.value
    );


  const opacidad =
    Number(
      controlOpacidad.value
    ) / 100;


  laminas.forEach(

    (
      pagina,
      indice
    ) => {


      const numero =
        indice + 1;


      /* ACUMULACIÓN */


      if (
        modoCapas ===
        "acumulacion"
      ) {


        if (
          numero <=
          seleccion
        ) {


          pagina.style.visibility =
            "visible";


          pagina.style.pointerEvents =
            "auto";


          pagina.style.opacity =
            opacidad;


          colocarPagina(
            pagina,
            indice
          );


        }


        else {


          pagina.style.visibility =
            "hidden";


          pagina.style.pointerEvents =
            "none";


          pagina.style.opacity =
            0;


        }


      }


      /* INDIVIDUAL */


      else {


        if (
          numero ===
          seleccion
        ) {


          pagina.style.visibility =
            "visible";


          pagina.style.pointerEvents =
            "auto";


          pagina.style.opacity =
            1;


          pagina.style.transform =
            "translate(0px,0px)";


        }


        else {


          pagina.style.visibility =
            "hidden";


          pagina.style.pointerEvents =
            "none";


          pagina.style.opacity =
            0;


        }


      }


    }

  );


  valorPaginas.textContent =
    `${seleccion} / ${documentoActual.paginas.length}`;


  valorOpacidad.textContent =
    `${controlOpacidad.value}%`;


  if (
    modoCapas ===
    "acumulacion"
  ) {


    etiquetaPaginas.textContent =
      "Capas visibles";


    controlOpacidad.disabled =
      false;


    restablecer.disabled =
      false;


    estadoCapas.textContent =

      seleccion === 1

      ?

      "Página 1 · arrastrá la lámina"

      :

      `Páginas 1–${seleccion} superpuestas · arrastrá las láminas para separarlas`;


  }


  else {


    etiquetaPaginas.textContent =
      "Página";


    controlOpacidad.disabled =
      true;


    restablecer.disabled =
      true;


    estadoCapas.textContent =
      `Página ${seleccion}`;


  }


  actualizarTamano();


}


/* =========================================
   TAMAÑO DE LÁMINAS
========================================= */

function actualizarTamano() {


  const tamano =
    Number(
      controlTamano.value
    );


  mesa.style.width =
    `${tamano}px`;


  valorTamano.textContent =
    `${tamano} px`;


}


/* =========================================
   ARRASTRE DE CAPAS
========================================= */

function configurarArrastre() {


  const laminas =
    [
      ...mesa.querySelectorAll(
        ".lamina"
      )
    ];


  laminas.forEach(

    pagina => {


      let arrastrando =
        false;


      let inicioMouseX =
        0;


      let inicioMouseY =
        0;


      let inicioPaginaX =
        0;


      let inicioPaginaY =
        0;


      pagina.addEventListener(

        "pointerdown",

        evento => {


          if (
            modoCapas !==
            "acumulacion"
          ) {


            return;


          }


          evento.preventDefault();


          const indice =
            Number(
              pagina.dataset.indice
            );


          arrastrando =
            true;


          inicioMouseX =
            evento.clientX;


          inicioMouseY =
            evento.clientY;


          inicioPaginaX =
            posiciones[indice].x;


          inicioPaginaY =
            posiciones[indice].y;


          zSuperior++;


          pagina.style.zIndex =
            zSuperior;


          pagina.classList.add(
            "arrastrando"
          );


          pagina.setPointerCapture(
            evento.pointerId
          );


        }

      );


      pagina.addEventListener(

        "pointermove",

        evento => {


          if (
            !arrastrando
          ) {


            return;


          }


          const indice =
            Number(
              pagina.dataset.indice
            );


          posiciones[indice].x =

            inicioPaginaX

            +

            evento.clientX

            -

            inicioMouseX;


          posiciones[indice].y =

            inicioPaginaY

            +

            evento.clientY

            -

            inicioMouseY;


          colocarPagina(
            pagina,
            indice
          );


        }

      );


      function terminarArrastre(
        evento
      ) {


        if (
          !arrastrando
        ) {


          return;


        }


        arrastrando =
          false;


        pagina.classList.remove(
          "arrastrando"
        );


        if (
          pagina.hasPointerCapture(
            evento.pointerId
          )
        ) {


          pagina.releasePointerCapture(
            evento.pointerId
          );


        }


      }


      pagina.addEventListener(
        "pointerup",
        terminarArrastre
      );


      pagina.addEventListener(
        "pointercancel",
        terminarArrastre
      );


    }

  );


}


/* =========================================
   RESTABLECER
========================================= */

restablecer.addEventListener(

  "click",

  () => {


    posiciones.forEach(

      (
        posicion,
        indice
      ) => {


        posicion.x =
          offsets[indice].x;


        posicion.y =
          offsets[indice].y;


      }

    );


    const laminas =
      [
        ...mesa.querySelectorAll(
          ".lamina"
        )
      ];


    laminas.forEach(

      (
        pagina,
        indice
      ) => {


        pagina.style.zIndex =
          indice + 1;


      }

    );


    zSuperior =
      documentoActual.paginas.length +
      100;


    actualizarCapas();


  }

);


/* =========================================
   MODOS INTERNOS DE CAPAS
========================================= */

modoAcumulacion.addEventListener(

  "click",

  () => {


    modoCapas =
      "acumulacion";


    modoAcumulacion.classList.add(
      "activo"
    );


    modoIndividual.classList.remove(
      "activo"
    );


    actualizarCapas();


  }

);



modoIndividual.addEventListener(

  "click",

  () => {


    modoCapas =
      "individual";


    modoIndividual.classList.add(
      "activo"
    );


    modoAcumulacion.classList.remove(
      "activo"
    );


    actualizarCapas();


  }

);


/* =========================================
   CONTROLES
========================================= */

controlPaginas.addEventListener(
  "input",
  actualizarCapas
);


controlOpacidad.addEventListener(
  "input",
  actualizarCapas
);


controlTamano.addEventListener(
  "input",
  actualizarTamano
);


</script>
