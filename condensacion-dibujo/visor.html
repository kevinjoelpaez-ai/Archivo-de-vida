<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Condensación de Dibujo</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #e9e9e9;
    }

    .lector {
      width: 100%;
      margin: 0 auto;
    }

    .barra {
      display: flex;
      justify-content: center;
      gap: 8px;

      padding: 12px;

      background: #f4f4f4;
      border-bottom: 1px solid #ccc;
    }

    .boton {
      border: 1px solid #999;
      background: white;
      color: #222;

      padding: 9px 18px;

      border-radius: 4px;

      font-size: 13px;
      cursor: pointer;
    }

    .boton.activo {
      background: #222;
      color: white;
      border-color: #222;
    }

    #visor {
      display: block;

      width: 100%;
      height: 820px;

      border: 0;
      background: #e9e9e9;
    }

    @media (max-width: 600px) {

      .barra {
        padding: 8px;
      }

      .boton {
        flex: 1;
        padding: 9px 6px;
      }

      #visor {
        height: 760px;
      }

    }

  </style>

</head>


<body>

<div class="lector">

  <div class="barra">

    <button
      id="botonLibro"
      class="boton activo"
      onclick="mostrarLibro()"
    >
      Hojear
    </button>

    <button
      id="botonCapas"
      class="boton"
      onclick="mostrarCapas()"
    >
      Superponer capas
    </button>

  </div>


  <iframe
    id="visor"
    src="index.html"
    allowfullscreen
  ></iframe>

</div>


<script>

  const visor =
    document.getElementById("visor");

  const botonLibro =
    document.getElementById("botonLibro");

  const botonCapas =
    document.getElementById("botonCapas");


  function mostrarLibro() {

    visor.src =
      "index.html";

    botonLibro.classList.add(
      "activo"
    );

    botonCapas.classList.remove(
      "activo"
    );

  }


  function mostrarCapas() {

    visor.src =
      "capas";

    botonCapas.classList.add(
      "activo"
    );

    botonLibro.classList.remove(
      "activo"
    );

  }

</script>

</body>

</html>
