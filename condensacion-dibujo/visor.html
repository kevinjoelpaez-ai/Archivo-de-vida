<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Condensación de Dibujo</title>


<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #e9e9e9;
}


.lector {
  width: 100%;
}


/* =========================
   SELECTOR DE MODO
========================= */

.barra {
  display: flex;
  justify-content: center;
  gap: 8px;

  padding: 12px;

  background: #f4f4f4;

  border-bottom:
    1px solid #ccc;
}


.boton {
  border:
    1px solid #999;

  background:
    white;

  color:
    #222;

  padding:
    9px 18px;

  border-radius:
    4px;

  font-size:
    13px;

  cursor:
    pointer;
}


.boton.activo {
  background:
    #222;

  color:
    white;

  border-color:
    #222;
}


/* =========================
   VISOR
========================= */

#visor {
  display: block;

  width: 100%;

  height: 820px;

  border: 0;

  background: #e9e9e9;

  transition:
    height .25s ease;
}


/* =========================
   MÓVIL
========================= */

@media (max-width:600px) {

  .barra {
    padding: 8px;
  }

  .boton {
    flex: 1;

    padding:
      9px 6px;
  }

}

</style>

</head>


<body>


<div class="lector">


  <div class="barra">


    <button
      id="botonLibro"
      class="boton activo"
    >
      Hojear
    </button>


    <button
      id="botonCapas"
      class="boton"
    >
      Superponer capas
    </button>


  </div>


  <iframe
    id="visor"
    src="index.html"
    allowfullscreen
  ></iframe>


</div>


<script>

const visor =
  document.getElementById(
    "visor"
  );


const botonLibro =
  document.getElementById(
    "botonLibro"
  );


const botonCapas =
  document.getElementById(
    "botonCapas"
  );


function mostrarLibro() {

  visor.src =
    "index.html";


  visor.style.height =
    "820px";


  botonLibro.classList.add(
    "activo"
  );


  botonCapas.classList.remove(
    "activo"
  );

}


function mostrarCapas() {

  visor.src =
    "capas.html";


  /*
    ALTURA GRANDE PARA
    LA MESA DE LÁMINAS
  */

  visor.style.height =
    "1650px";


  botonCapas.classList.add(
    "activo"
  );


  botonLibro.classList.remove(
    "activo"
  );

}


botonLibro.addEventListener(
  "click",
  mostrarLibro
);


botonCapas.addEventListener(
  "click",
  mostrarCapas
);

</script>

</body>

</html>
