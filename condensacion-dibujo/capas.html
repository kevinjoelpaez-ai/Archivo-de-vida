<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Condensación de Dibujo — Capas</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  background: #e9e9e9;
  color: #222;
}

.visor {
  width: 100%;
  min-height: 100vh;

  display: flex;
  flex-direction: column;
  align-items: center;

  padding: 24px 0 40px;
}


/* =========================
   CONTROLES
========================= */

.controles {
  width: min(calc(100% - 32px), 720px);

  background: rgba(255,255,255,.95);

  padding: 18px 22px;
  margin-bottom: 24px;

  border: 1px solid rgba(0,0,0,.12);
  border-radius: 8px;
}

.titulo {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 18px;
}

.control {
  margin-bottom: 16px;
}

.control:last-child {
  margin-bottom: 0;
}

.fila {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-bottom: 7px;
}

label {
  font-size: 13px;
  font-weight: bold;
}

.valor {
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}

input[type="range"] {
  width: 100%;
}


/* =========================
   BOTONES
========================= */

.modos {
  display: flex;
  gap: 8px;
}

button {
  border: 1px solid #999;
  background: white;
  color: #222;

  padding: 8px 12px;

  border-radius: 4px;
  cursor: pointer;
}

.modo {
  flex: 1;
}

.modo.activo {
  background: #222;
  color: white;
  border-color: #222;
}

#restablecer {
  width: 100%;
}


/* =========================
   ZONA DESPLAZABLE
========================= */

.zona-scroll {
  width: 100%;

  overflow-x: auto;
  overflow-y: visible;

  padding-bottom: 20px;

  scrollbar-gutter: stable;
}


/* =========================
   MESA GRANDE
========================= */

.zona-mesa {
  position: relative;

  width: 1600px;
  height: 1250px;

  margin: 0 auto;

  background:
    radial-gradient(
      circle at center,
      rgba(255,255,255,.4),
      rgba(255,255,255,0) 60%
    );
}


/* =========================
   PILA DE LÁMINAS
========================= */

.mesa {
  position: absolute;

  top: 40px;
  left: 50%;

  width: 440px;

  aspect-ratio: 1165 / 1653;

  transform: translateX(-50%);

  isolation: isolate;
  overflow: visible;
}


/* =========================
   PÁGINAS
========================= */

.pagina {
  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 100%;

  object-fit: contain;

  mix-blend-mode: multiply;

  transform-origin: center;

  cursor: grab;

  user-select: none;
  -webkit-user-select: none;

  touch-action: none;

  transition:
    opacity .2s ease,
    visibility .2s ease;
}

.pagina.arrastrando {
  cursor: grabbing;
}


/* =========================
   ESTADO
========================= */

.estado {
  width: min(calc(100% - 32px), 720px);

  margin-top: 12px;

  font-size: 12px;
  color: #666;

  text-align: center;
}


/* =========================
   MÓVIL
========================= */

@media (max-width:600px) {

  .visor {
    padding-top: 12px;
  }

  .controles {
    width: calc(100% - 20px);
    padding: 14px;
  }

  .zona-mesa {
    width: 1200px;
    height: 1100px;
  }

}

</style>

</head>


<body>

<div class="visor">


  <!-- CONTROLES -->

  <div class="controles">

    <div class="titulo">
      Condensación de Dibujo — capas
    </div>


    <!-- MODO -->

    <div class="control">

      <div class="fila">
        <label>Modo de visualización</label>
      </div>

      <div class="modos">

        <button
          id="modoAcumulacion"
          class="modo activo"
        >
          Acumulación
        </button>

        <button
          id="modoIndividual"
          class="modo"
        >
          Página individual
        </button>

      </div>

    </div>


    <!-- CAPAS -->

    <div class="control">

      <div class="fila">

        <label id="etiquetaPaginas">
          Capas visibles
        </label>

        <span
          id="valorPaginas"
          class="valor"
        >
          16 / 16
        </span>

      </div>

      <input
        id="controlPaginas"
        type="range"
        min="1"
        max="16"
        value="16"
        step="1"
      >

    </div>


    <!-- OPACIDAD -->

    <div class="control">

      <div class="fila">

        <label>
          Opacidad de cada capa
        </label>

        <span
          id="valorOpacidad"
          class="valor"
        >
          25%
        </span>

      </div>

      <input
        id="controlOpacidad"
        type="range"
        min="5"
        max="100"
        value="25"
        step="1"
      >

    </div>


    <!-- TAMAÑO -->

    <div class="control">

      <div class="fila">

        <label>
          Tamaño de las láminas
        </label>

        <span
          id="valorTamano"
          class="valor"
        >
          440 px
        </span>

      </div>

      <input
        id="controlTamano"
        type="range"
        min="250"
        max="800"
        value="440"
        step="10"
      >

    </div>


    <!-- RESTABLECER -->

    <div class="control">

      <button id="restablecer">
        Restablecer posición de las capas
      </button>

    </div>

  </div>


  <!-- MESA GRANDE -->

  <div
    id="zonaScroll"
    class="zona-scroll"
  >

    <div class="zona-mesa">

      <div
        id="mesa"
        class="mesa"
      ></div>

    </div>

  </div>


  <div
    id="estado"
    class="estado"
  >
    Páginas 1–16 superpuestas · arrastrá las láminas para dispersarlas sobre la mesa
  </div>


</div>


<script>

/* =========================
   CONFIGURACIÓN
========================= */

const TOTAL_PAGINAS = 16;

const mesa =
  document.getElementById("mesa");

const zonaScroll =
  document.getElementById("zonaScroll");

const controlPaginas =
  document.getElementById("controlPaginas");

const controlOpacidad =
  document.getElementById("controlOpacidad");

const controlTamano =
  document.getElementById("controlTamano");

const valorPaginas =
  document.getElementById("valorPaginas");

const valorOpacidad =
  document.getElementById("valorOpacidad");

const valorTamano =
  document.getElementById("valorTamano");

const etiquetaPaginas =
  document.getElementById("etiquetaPaginas");

const estado =
  document.getElementById("estado");

const botonAcumulacion =
  document.getElementById("modoAcumulacion");

const botonIndividual =
  document.getElementById("modoIndividual");

const botonRestablecer =
  document.getElementById("restablecer");

let modo = "acumulacion";

let zSuperior = 100;


/* =========================
   DESFASE INICIAL
========================= */

const offsets = [

  { x:  0, y:  0 },
  { x:  2, y:  0 },
  { x: -1, y:  1 },
  { x:  1, y: -1 },

  { x: -2, y:  1 },
  { x:  0, y: -2 },
  { x:  2, y:  1 },
  { x: -1, y: -2 },

  { x:  1, y:  2 },
  { x: -2, y:  0 },
  { x:  2, y: -1 },
  { x:  0, y:  2 },

  { x: -1, y:  1 },
  { x:  1, y: -2 },
  { x: -2, y: -1 },
  { x:  2, y:  2 }

];


const posiciones =
  offsets.map(offset => ({
    x: offset.x,
    y: offset.y
  }));


/* =========================
   CREAR PÁGINAS
========================= */

for (
  let numero = 1;
  numero <= TOTAL_PAGINAS;
  numero++
) {

  const imagen =
    document.createElement("img");

  const numeroArchivo =
    String(numero).padStart(3, "0");

  imagen.src =
    `pages/page${numeroArchivo}.png`;

  imagen.alt =
    `Página ${numero}`;

  imagen.className =
    "pagina";

  imagen.dataset.pagina =
    numero;

  imagen.dataset.indice =
    numero - 1;

  imagen.draggable =
    false;

  imagen.style.zIndex =
    numero;

  mesa.appendChild(imagen);

}


const paginas =
  [...document.querySelectorAll(".pagina")];


/* =========================
   POSICIONAR
========================= */

function colocarPagina(
  pagina,
  indice
) {

  pagina.style.transform =
    `translate(
      ${posiciones[indice].x}px,
      ${posiciones[indice].y}px
    )`;

}


/* =========================
   TAMAÑO
========================= */

function actualizarTamano() {

  const tamano =
    Number(controlTamano.value);

  mesa.style.width =
    `${tamano}px`;

  valorTamano.textContent =
    `${tamano} px`;

}


/* =========================
   ACTUALIZAR VISOR
========================= */

function actualizarVisor() {

  const seleccion =
    Number(controlPaginas.value);

  const opacidad =
    Number(controlOpacidad.value) / 100;


  paginas.forEach(
    (pagina, indice) => {

      const numero =
        indice + 1;


      /* ACUMULACIÓN */

      if (
        modo === "acumulacion"
      ) {

        if (
          numero <= seleccion
        ) {

          pagina.style.visibility =
            "visible";

          pagina.style.pointerEvents =
            "auto";

          pagina.style.opacity =
            opacidad;

          colocarPagina(
            pagina,
            indice
          );

        }

        else {

          pagina.style.visibility =
            "hidden";

          pagina.style.pointerEvents =
            "none";

          pagina.style.opacity =
            0;

        }

      }


      /* INDIVIDUAL */

      if (
        modo === "individual"
      ) {

        if (
          numero === seleccion
        ) {

          pagina.style.visibility =
            "visible";

          pagina.style.pointerEvents =
            "auto";

          pagina.style.opacity =
            1;

          pagina.style.transform =
            "translate(0px,0px)";

        }

        else {

          pagina.style.visibility =
            "hidden";

          pagina.style.pointerEvents =
            "none";

          pagina.style.opacity =
            0;

        }

      }

    }
  );


  valorPaginas.textContent =
    `${seleccion} / ${TOTAL_PAGINAS}`;

  valorOpacidad.textContent =
    `${controlOpacidad.value}%`;


  if (
    modo === "acumulacion"
  ) {

    etiquetaPaginas.textContent =
      "Capas visibles";

    controlOpacidad.disabled =
      false;

    botonRestablecer.disabled =
      false;

    estado.textContent =
      seleccion === 1
      ? "Página 1 · arrastrá la lámina sobre la mesa"
      : `Páginas 1–${seleccion} superpuestas · arrastrá las láminas para dispersarlas`;

  }


  if (
    modo === "individual"
  ) {

    etiquetaPaginas.textContent =
      "Página";

    controlOpacidad.disabled =
      true;

    botonRestablecer.disabled =
      true;

    estado.textContent =
      `Página ${seleccion}`;

  }


  actualizarTamano();

}


/* =========================
   ARRASTRAR
========================= */

paginas.forEach(
  pagina => {

    let arrastrando =
      false;

    let inicioMouseX =
      0;

    let inicioMouseY =
      0;

    let inicioPaginaX =
      0;

    let inicioPaginaY =
      0;


    pagina.addEventListener(
      "pointerdown",
      evento => {

        if (
          modo !== "acumulacion"
        ) {
          return;
        }


        evento.preventDefault();


        const indice =
          Number(
            pagina.dataset.indice
          );


        arrastrando =
          true;


        inicioMouseX =
          evento.clientX;

        inicioMouseY =
          evento.clientY;


        inicioPaginaX =
          posiciones[indice].x;

        inicioPaginaY =
          posiciones[indice].y;


        zSuperior++;

        pagina.style.zIndex =
          zSuperior;


        pagina.classList.add(
          "arrastrando"
        );


        pagina.setPointerCapture(
          evento.pointerId
        );

      }
    );


    pagina.addEventListener(
      "pointermove",
      evento => {

        if (
          !arrastrando
        ) {
          return;
        }


        const indice =
          Number(
            pagina.dataset.indice
          );


        posiciones[indice].x =
          inicioPaginaX +
          evento.clientX -
          inicioMouseX;


        posiciones[indice].y =
          inicioPaginaY +
          evento.clientY -
          inicioMouseY;


        colocarPagina(
          pagina,
          indice
        );

      }
    );


    function terminarArrastre(
      evento
    ) {

      if (
        !arrastrando
      ) {
        return;
      }


      arrastrando =
        false;


      pagina.classList.remove(
        "arrastrando"
      );


      if (
        pagina.hasPointerCapture(
          evento.pointerId
        )
      ) {

        pagina.releasePointerCapture(
          evento.pointerId
        );

      }

    }


    pagina.addEventListener(
      "pointerup",
      terminarArrastre
    );


    pagina.addEventListener(
      "pointercancel",
      terminarArrastre
    );

  }
);


/* =========================
   RESTABLECER
========================= */

botonRestablecer.addEventListener(
  "click",
  () => {

    posiciones.forEach(
      (posicion, indice) => {

        posicion.x =
          offsets[indice].x;

        posicion.y =
          offsets[indice].y;


        paginas[indice].style.zIndex =
          indice + 1;

      }
    );


    zSuperior =
      100;


    actualizarVisor();

  }
);


/* =========================
   MODOS
========================= */

botonAcumulacion.addEventListener(
  "click",
  () => {

    modo =
      "acumulacion";


    botonAcumulacion.classList.add(
      "activo"
    );


    botonIndividual.classList.remove(
      "activo"
    );


    actualizarVisor();

  }
);


botonIndividual.addEventListener(
  "click",
  () => {

    modo =
      "individual";


    botonIndividual.classList.add(
      "activo"
    );


    botonAcumulacion.classList.remove(
      "activo"
    );


    actualizarVisor();

  }
);


/* =========================
   SLIDERS
========================= */

controlPaginas.addEventListener(
  "input",
  actualizarVisor
);


controlOpacidad.addEventListener(
  "input",
  actualizarVisor
);


controlTamano.addEventListener(
  "input",
  actualizarTamano
);


/* =========================
   CENTRAR MESA AL ABRIR
========================= */

function centrarZona() {

  zonaScroll.scrollLeft =
    (
      zonaScroll.scrollWidth -
      zonaScroll.clientWidth
    ) / 2;

}


/* =========================
   INICIAR
========================= */

actualizarVisor();


requestAnimationFrame(
  centrarZona
);

</script>

</body>

</html>
